<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro - ONG Mãos Solidárias</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>

        <h1>ONG Mãos Solidárias</h1>

        <button class="menu-mobile" id="botao-menu">☰</button>

        <nav id="menu">

            <a href="index.html">Início</a>

            <div class="dropdown">

                <a href="projetos.html">Projetos</a>

                <div class="dropdown-menu">
                    <a href="projetos.html">Campanha de Alimentos</a>
                    <a href="projetos.html">Doação de Roupas</a>
                    <a href="projetos.html">Ações Comunitárias</a>
                </div>

            </div>

            <a href="cadastro.html">Seja Voluntário</a>

        </nav>

    </header>

    <main>

        <h2>Seja Voluntário</h2>

        <div class="alerta">
            Preencha todos os campos para realizar seu cadastro.
        </div>

        <form id="formulario">

            <fieldset>

                <legend>Dados pessoais</legend>

                <label for="nome">Nome:</label>
                <input type="text" id="nome" required>

                <br><br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" required>

                <br><br>

                <label for="cpf">CPF:</label>
                <input
                    type="text"
                    id="cpf"
                    maxlength="14"
                    pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                    placeholder="000.000.000-00"
                    required
                >

                <br><br>

                <label for="telefone">Telefone:</label>
                <input
                    type="tel"
                    id="telefone"
                    maxlength="15"
                    pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                    placeholder="(00) 00000-0000"
                    required
                >

                <br><br>

                <label for="cep">CEP:</label>
                <input
                    type="text"
                    id="cep"
                    maxlength="9"
                    pattern="[0-9]{5}-[0-9]{3}"
                    placeholder="00000-000"
                    required
                >

            </fieldset>

            <br>

            <fieldset>

                <legend>Voluntariado</legend>

                <label for="area">Área de interesse:</label>

                <select id="area" required>

                    <option value="">Escolha uma opção</option>
                    <option value="doacao">Doações</option>
                    <option value="eventos">Eventos</option>
                    <option value="acoes">Ações sociais</option>

                </select>

                <br><br>

                <label for="mensagem">Mensagem:</label>

                <br>

                <textarea
                    id="mensagem"
                    rows="5"
                    required
                ></textarea>

            </fieldset>

            <br>

            <button type="submit">Enviar</button>

        </form>

        <div id="toast" class="toast">
            Cadastro realizado com sucesso!
        </div>

    </main>

    <footer>

        <p>&copy; 2026 ONG Mãos Solidárias</p>

    </footer>

    <script src="js/script.js"></script>

</body>

</html>
